<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" role="img" aria-label="Urano Guard demos">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#0c1116"/>
      <stop offset="100%" stop-color="#161c24"/>
    </linearGradient>
    <radialGradient id="glowTeal" cx="14%" cy="8%" r="48%">
      <stop offset="0%" stop-color="#3dba9a" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#3dba9a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRust" cx="94%" cy="12%" r="42%">
      <stop offset="0%" stop-color="#e09a5b" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#e09a5b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2c3642" stroke-width="0.7"/>
    </pattern>
    <linearGradient id="markFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b222c"/>
      <stop offset="100%" stop-color="#12161c"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="380" fill="url(#bg)"/>
  <rect width="1280" height="380" fill="url(#glowTeal)"/>
  <rect width="1280" height="380" fill="url(#glowRust)"/>
  <rect width="1280" height="380" fill="url(#grid)" opacity="0.38"/>
  <rect width="1280" height="4" fill="#0f5c4c"/>
  <rect y="376" width="1280" height="4" fill="#c45c26"/>

  <!-- Shield mark -->
  <g transform="translate(88 98)">
    <path
      d="M78 6 L150 38 V118 C150 164 78 196 78 196 C78 196 6 164 6 118 V38 Z"
      fill="url(#markFill)"
      stroke="#3dba9a"
      stroke-width="3.2"
    />
    <path
      d="M78 28 L126 50 V112 C126 142 78 166 78 166 C78 166 30 142 30 112 V50 Z"
      fill="none"
      stroke="#3dba9a"
      stroke-opacity="0.35"
      stroke-width="1.4"
    />
    <text
      x="78"
      y="118"
      text-anchor="middle"
      fill="#3dba9a"
      font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
      font-size="44"
      font-weight="700"
      letter-spacing="2"
    >UG</text>
  </g>

  <!-- Wordmark -->
  <text
    x="292"
    y="148"
    fill="#9aa6b2"
    font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
    font-size="13"
    font-weight="600"
    letter-spacing="6"
  >@URANOTOOLS</text>
  <text
    x="292"
    y="204"
    fill="#edf1f5"
    font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
    font-size="54"
    font-weight="700"
    letter-spacing="3"
  >URANO GUARD</text>
  <rect x="292" y="222" width="64" height="4" fill="#c45c26"/>
  <text
    x="368"
    y="232"
    fill="#3dba9a"
    font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
    font-size="22"
    font-weight="700"
    letter-spacing="10"
  >DEMOS</text>
  <text
    x="292"
    y="276"
    fill="#9aa6b2"
    font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
    font-size="16"
  >Labs in-process  ù  consola SOC  ù  schema 1.0</text>

  <!-- Mini pipeline -->
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="600">
    <rect x="888" y="118" width="92" height="32" rx="16" fill="#1b222c" stroke="#2c3642"/>
    <text x="934" y="138" text-anchor="middle" fill="#edf1f5">BROWSER</text>
    <path d="M988 134 H1010" stroke="#3dba9a" stroke-width="2"/>
    <rect x="1010" y="118" width="70" height="32" rx="16" fill="#0f5c4c"/>
    <text x="1045" y="138" text-anchor="middle" fill="#f4fff9">HUB</text>
    <path d="M1088 134 H1110" stroke="#3dba9a" stroke-width="2"/>
    <rect x="1110" y="118" width="88" height="32" rx="16" fill="#1b222c" stroke="#3dba9a"/>
    <text x="1154" y="138" text-anchor="middle" fill="#3dba9a">GUARD</text>
    <path d="M1154 150 V186" stroke="#c45c26" stroke-width="2"/>
    <rect x="1010" y="186" width="188" height="32" rx="16" fill="#1b222c" stroke="#e09a5b"/>
    <text x="1104" y="206" text-anchor="middle" fill="#e09a5b">DESKTOP AGENT</text>
  </g>
