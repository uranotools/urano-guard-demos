services:
  app:
    image: node:20-alpine
    working_dir: /repo
    command: sh -c "npm install --workspace=@urano/demo-04-nginx --include-workspace-root && npm run start -w @urano/demo-04-nginx"
    volumes:
      - ../..:/repo
      - ../../../urano-guard:/urano-guard
    environment:
      PORT: "3004"
      AGENT_URL: ${AGENT_URL:-http://host.docker.internal:6274/v1/webhook/mcp_cyber-gateway/default}
      AGENT_TOKEN: ${AGENT_TOKEN:-}
      AGENT_TIMEOUT_MS: "35000"
      TRUST_PROXY: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
